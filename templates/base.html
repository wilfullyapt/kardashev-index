<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Kardashev Index{% endblock %}</title>
    
    <!-- Tailwind CSS via CDN (MVP) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        zinc: {
                            950: '#0a0a0a',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-200">
    <!-- Navigation -->
    <nav class="border-b border-zinc-800 bg-zinc-950 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-8">
                <a href="/" class="text-2xl font-bold tracking-tight">Kardashev Index</a>
                <div class="hidden md:flex items-center gap-6 text-sm">
                    <a href="/" class="hover:text-white transition-colors">Leaderboard</a>
                    <a href="/suggest" class="hover:text-white transition-colors">Suggest</a>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <span class="px-3 py-1 text-xs font-mono bg-zinc-900 border border-zinc-800 rounded">
                    {{ version|default('v0.1') }}
                </span>
                <a href="/internal/health" class="text-xs text-zinc-500 hover:text-zinc-400">Status</a>
            </div>
        </div>
    </nav>

    <!-- Flash messages -->
    {% if success %}
    <div class="max-w-6xl mx-auto px-6 pt-4">
        <div class="bg-emerald-900/30 border border-emerald-800 text-emerald-400 px-4 py-3 rounded text-sm">
            {{ success }}
        </div>
    </div>
    {% endif %}
    {% if error %}
    <div class="max-w-6xl mx-auto px-6 pt-4">
        <div class="bg-red-900/30 border border-red-800 text-red-400 px-4 py-3 rounded text-sm">
            {{ error }}
        </div>
    </div>
    {% endif %}

    <!-- Main content -->
    <main class="max-w-6xl mx-auto px-6 py-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="border-t border-zinc-800 mt-12 py-8 text-center text-xs text-zinc-500">
        Public rankings by Effective Accelerationism alignment • Human-reviewed only
    </footer>
</body>
</html>
