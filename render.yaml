services:
  - type: web
    name: kardashev-index
    env: python
    buildCommand: "pip install --only-binary :all: -r requirements.txt && alembic upgrade head"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kardashev-index-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: HERMES_API_KEY
        sync: false
      - key: GROK_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
    autoDeploy: true

databases:
  - name: kardashev-index-db
    plan: basic-256mb
    region: oregon
