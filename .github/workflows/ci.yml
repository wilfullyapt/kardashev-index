name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff (pinned in requirements-dev.txt)
        run: pip install "$(grep -E '^ruff==' requirements-dev.txt)"
      - name: Lint
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Test (SQLite)
        run: pytest

  test-postgres:
    # Same suite against Postgres (production database engine), incl. migrations' data fixes.
    # Not a required check yet; the owner can add it to the main ruleset.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ki
          POSTGRES_PASSWORD: ki
          POSTGRES_DB: ki_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ki" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://ki:ki@localhost:5432/ki_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Test (Postgres)
        run: pytest
