{% extends "base.html" %}

{% block title %}Admin Login — Kardashev Index{% endblock %}
{% block head %}<meta name="robots" content="noindex, nofollow">{% endblock %}

{% block content %}
<div class="login">
    {{ ki.mark("login__mark") }}
    <p class="eyebrow eyebrow--plain" style="display:flex;justify-content:center">Restricted</p>
    <h1 class="h2" style="text-align:center;margin-bottom:2rem">Admin login</h1>

    <form method="post" action="/admin/login" class="panel stack">
        <input type="hidden" name="next" value="{{ next or '/admin' }}">
        <div class="field">
            <label class="label" for="a-email">Email</label>
            <input id="a-email" type="email" name="email" required class="input" autocomplete="username">
        </div>
        <div class="field">
            <label class="label" for="a-pass">Password</label>
            <input id="a-pass" type="password" name="password" required class="input" autocomplete="current-password">
        </div>
        <button type="submit" class="btn" style="width:100%">Login</button>
    </form>
</div>
{% endblock %}
