# Dependabot version updates (weekly, grouped). Security alerts/updates are a separate
# repository setting (Settings → Code security) that the owner toggles.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"            # requirements.txt + requirements-dev.txt
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: [minor, patch]
      python-major:
        update-types: [major]
    ignore:
      # passlib 1.7.4 is incompatible with bcrypt 5 (raises on its own >72-byte self-test)
      - dependency-name: bcrypt
        update-types: [version-update:semver-major]
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
    labels: [dependencies]
