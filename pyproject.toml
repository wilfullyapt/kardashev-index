# Project metadata. The version is read from app/version.py (single source of truth).
# Render installs with `pip install -r requirements.txt`; this file is not used to deploy.
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kardashev-index"
description = "Ranks companies by how far along the Kardashev scale their operations are."
requires-python = ">=3.11"
dynamic = ["version"]

[tool.setuptools.dynamic]
version = { attr = "app.version.__version__" }

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["E402", "E722", "I001", "B008", "RUF013", "BLE001", "S110"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
