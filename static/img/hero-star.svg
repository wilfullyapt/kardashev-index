<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A star wrapped in a Dyson swarm rising over a planet's limb">
  <defs>
    <radialGradient id="sky" cx="1130" cy="455" r="1300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3a2516"/>
      <stop offset=".22" stop-color="#1c130d"/>
      <stop offset=".55" stop-color="#0b0908"/>
      <stop offset="1" stop-color="#050507"/>
    </radialGradient>
    <radialGradient id="halo" cx="1130" cy="455" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f38404" stop-opacity=".55"/>
      <stop offset=".35" stop-color="#d55903" stop-opacity=".22"/>
      <stop offset="1" stop-color="#d55903" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="corona" cx="1130" cy="455" r="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset=".22" stop-color="#fff1d6"/>
      <stop offset=".42" stop-color="#eeb072" stop-opacity=".9"/>
      <stop offset=".7" stop-color="#f38404" stop-opacity=".35"/>
      <stop offset="1" stop-color="#f38404" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flare" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#eeb072" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff3dc" stop-opacity=".9"/>
      <stop offset="1" stop-color="#eeb072" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c69667" stop-opacity="0"/>
      <stop offset=".35" stop-color="#c69667" stop-opacity=".35"/>
      <stop offset=".7" stop-color="#ffe2b0" stop-opacity="1"/>
      <stop offset="1" stop-color="#eeb072" stop-opacity=".35"/>
    </linearGradient>
    <radialGradient id="planet" cx="1130" cy="620" r="1500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1d1610"/>
      <stop offset=".25" stop-color="#0c0a08"/>
      <stop offset="1" stop-color="#050507"/>
    </radialGradient>
    <filter id="blur8" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="blur2" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <clipPath id="above"><rect x="0" y="0" width="1600" height="900"/></clipPath>
    <style>
      .ring{fill:none;stroke:#c69667;stroke-opacity:.38;stroke-width:1}
      .swarm{fill:none;stroke:#eeb072;stroke-width:2.2;stroke-linecap:butt}
      .s1{stroke-dasharray:7 17;stroke-opacity:.85;animation:orbit 90s linear infinite}
      .s2{stroke-dasharray:5 13;stroke-opacity:.7;animation:orbit 140s linear infinite reverse}
      .s3{stroke-dasharray:9 24;stroke-opacity:.55;animation:orbit 200s linear infinite}
      .pulse{animation:pulse 9s ease-in-out infinite;transform-origin:1130px 455px}
      @keyframes orbit{to{stroke-dashoffset:-1000}}
      @keyframes pulse{0%,100%{opacity:.9}50%{opacity:1}}
      @media (prefers-reduced-motion:reduce){.s1,.s2,.s3,.pulse{animation:none}}
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <g>
    <circle cx="1023" cy="15" r="0.8" fill="#f6eedd" opacity="0.38"/>
    <circle cx="223" cy="61" r="1.4" fill="#f6eedd" opacity="0.74"/>
    <circle cx="139" cy="253" r="0.6" fill="#f6eedd" opacity="0.30"/>
    <circle cx="372" cy="361" r="1.1" fill="#f6eedd" opacity="0.36"/>
    <circle cx="353" cy="354" r="0.6" fill="#f6eedd" opacity="0.67"/>
    <circle cx="255" cy="254" r="0.8" fill="#f6eedd" opacity="0.34"/>
    <circle cx="1532" cy="202" r="0.6" fill="#f6eedd" opacity="0.46"/>
    <circle cx="574" cy="206" r="0.8" fill="#f6eedd" opacity="0.69"/>
    <circle cx="1557" cy="227" r="1.1" fill="#f6eedd" opacity="0.41"/>
    <circle cx="579" cy="115" r="0.6" fill="#f6eedd" opacity="0.28"/>
    <circle cx="365" cy="174" r="0.6" fill="#f6eedd" opacity="0.72"/>
    <circle cx="1386" cy="228" r="0.9" fill="#f6eedd" opacity="0.60"/>
    <circle cx="584" cy="222" r="0.7" fill="#f6eedd" opacity="0.62"/>
    <circle cx="114" cy="381" r="1.1" fill="#f6eedd" opacity="0.65"/>
    <circle cx="261" cy="228" r="1.4" fill="#f6eedd" opacity="0.63"/>
    <circle cx="351" cy="195" r="0.6" fill="#f6eedd" opacity="0.38"/>
    <circle cx="51" cy="189" r="0.8" fill="#f6eedd" opacity="0.29"/>
    <circle cx="1461" cy="340" r="1.4" fill="#f6eedd" opacity="0.42"/>
    <circle cx="1463" cy="275" r="0.8" fill="#f6eedd" opacity="0.33"/>
    <circle cx="1596" cy="83" r="0.9" fill="#f6eedd" opacity="0.30"/>
    <circle cx="75" cy="66" r="1.4" fill="#f6eedd" opacity="0.34"/>
    <circle cx="616" cy="358" r="0.9" fill="#f6eedd" opacity="0.54"/>
    <circle cx="1554" cy="516" r="0.6" fill="#f6eedd" opacity="0.62"/>
    <circle cx="183" cy="531" r="0.8" fill="#f6eedd" opacity="0.67"/>
    <circle cx="544" cy="176" r="0.7" fill="#f6eedd" opacity="0.50"/>
    <circle cx="1526" cy="526" r="0.8" fill="#f6eedd" opacity="0.78"/>
    <circle cx="170" cy="375" r="1.4" fill="#f6eedd" opacity="0.53"/>
    <circle cx="318" cy="224" r="0.7" fill="#f6eedd" opacity="0.55"/>
    <circle cx="1" cy="194" r="0.6" fill="#f6eedd" opacity="0.31"/>
    <circle cx="581" cy="591" r="0.8" fill="#f6eedd" opacity="0.38"/>
    <circle cx="385" cy="340" r="0.6" fill="#f6eedd" opacity="0.30"/>
    <circle cx="778" cy="42" r="1.1" fill="#f6eedd" opacity="0.67"/>
    <circle cx="205" cy="285" r="1.1" fill="#f6eedd" opacity="0.34"/>
    <circle cx="1543" cy="557" r="1.4" fill="#f6eedd" opacity="0.63"/>
    <circle cx="1439" cy="271" r="0.7" fill="#f6eedd" opacity="0.37"/>
    <circle cx="541" cy="353" r="0.7" fill="#f6eedd" opacity="0.57"/>
    <circle cx="12" cy="425" r="0.6" fill="#f6eedd" opacity="0.38"/>
    <circle cx="113" cy="143" r="1.4" fill="#f6eedd" opacity="0.52"/>
    <circle cx="389" cy="284" r="0.9" fill="#f6eedd" opacity="0.35"/>
    <circle cx="155" cy="259" r="0.9" fill="#f6eedd" opacity="0.48"/>
    <circle cx="1382" cy="33" r="1.4" fill="#f6eedd" opacity="0.79"/>
    <circle cx="157" cy="242" r="0.8" fill="#f6eedd" opacity="0.69"/>
    <circle cx="175" cy="115" r="1.1" fill="#f6eedd" opacity="0.50"/>
    <circle cx="675" cy="167" r="0.7" fill="#f6eedd" opacity="0.73"/>
    <circle cx="121" cy="485" r="1.1" fill="#f6eedd" opacity="0.30"/>
    <circle cx="24" cy="56" r="0.7" fill="#f6eedd" opacity="0.34"/>
    <circle cx="777" cy="128" r="0.9" fill="#f6eedd" opacity="0.75"/>
    <circle cx="263" cy="1" r="0.9" fill="#f6eedd" opacity="0.40"/>
    <circle cx="677" cy="574" r="1.1" fill="#f6eedd" opacity="0.61"/>
    <circle cx="779" cy="114" r="0.7" fill="#f6eedd" opacity="0.78"/>
  </g>

  <!-- hairline orbital architecture -->
  <g transform="translate(1130 455)">
    <ellipse class="ring" rx="560" ry="150" transform="rotate(-14)" stroke-opacity=".18"/>
    <ellipse class="ring" rx="420" ry="112" transform="rotate(-14)"/>
    <ellipse class="ring" rx="300" ry="96" transform="rotate(9)"/>
    <ellipse class="ring" rx="225" ry="225" stroke-opacity=".16" stroke-dasharray="1 7"/>
  </g>

  <circle cx="1130" cy="455" r="560" fill="url(#halo)"/>

  <!-- Dyson swarm: collectors in orbit -->
  <g transform="translate(1130 455)">
    <ellipse class="swarm s1" rx="420" ry="112" transform="rotate(-14)"/>
    <ellipse class="swarm s2" rx="300" ry="96" transform="rotate(9)"/>
    <ellipse class="swarm s3" rx="168" ry="168" transform="rotate(-30)"/>
  </g>

  <!-- the star -->
  <g class="pulse">
    <circle cx="1130" cy="455" r="190" fill="url(#corona)"/>
    <circle cx="1130" cy="455" r="38" fill="#fffaf0" filter="url(#blur2)"/>
  </g>
  <rect x="490" y="453.5" width="1280" height="3" fill="url(#flare)" opacity=".75"/>
  <rect x="870" y="454.4" width="520" height="1.2" fill="#fff6e6" opacity=".9"/>

  <!-- planet limb, lit from the star -->
  <circle cx="760" cy="2480" r="1820" fill="url(#planet)"/>
  <circle cx="760" cy="2480" r="1822" fill="none" stroke="url(#rim)" stroke-width="16" stroke-opacity=".55" filter="url(#blur8)"/>
  <circle cx="760" cy="2480" r="1820" fill="none" stroke="url(#rim)" stroke-width="1.6"/>
</svg>
